<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#323d81" />
    <meta
      name="description"
      content="بوصلة المال — مركز مالي عربي منظم للمعاملات الحقيقية والأرصدة والبنود والالتزامات والديون والمشاريع برسوم أعمدة مستقلة"
    />
    <title>بوصلة المال | مركزك المالي الفعلي</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="actual-v1.css?v=3.0.6" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-head">
        <div class="head-inner">
          <div class="identity">
            <div class="mark" aria-hidden="true">◈</div>
            <div>
              <h1>بوصلة المال</h1>
              <p>الحسابات الفعلية مع توقعات مستقبلية مستقلة</p>
            </div>
          </div>
          <div class="live-flag"><span></span> بياناتك محليًا</div>
        </div>
      </header>
      <main>
        <div style="max-width: 1180px; margin: 12px auto; padding: 0 18px">
          <a
            href="surplus.html"
            style="
              display: inline-block;
              padding: 11px 17px;
              border-radius: 12px;
              background: #18765c;
              color: white;
              text-decoration: none;
              font-weight: 700;
              margin: 4px;
            "
            >إدارة الفائض المالي</a
          ><a
            href="financial-forecast.html"
            style="
              display: inline-block;
              padding: 11px 17px;
              border-radius: 12px;
              background: #344e94;
              color: white;
              text-decoration: none;
              font-weight: 700;
            "
            >📊 التوقعات المالية الشهرية ٢٠٢٦–٢٠٣٦</a
          >
        </div>
        <section class="nav-shell" aria-label="التنقل بين أقسام المركز المالي">
          <div class="selectors">
            <div class="select-wrap">
              <label for="pageNav">القسم الرئيسي</label
              ><select id="pageNav" aria-label="اختر القسم الرئيسي"></select>
            </div>
            <div class="select-wrap">
              <label for="subNav">الصفحة الفرعية</label
              ><select id="subNav" aria-label="اختر الصفحة الفرعية"></select>
            </div>
            <div class="select-wrap" id="periodBox">
              <label for="monthNav">الشهر</label>
              <div class="month-switch">
                <button
                  class="mini-btn"
                  id="prevMonth"
                  aria-label="الشهر السابق"
                  title="الشهر السابق"
                >
                  ›</button
                ><input
                  type="month"
                  id="monthNav"
                  aria-label="الشهر المختار"
                /><button
                  class="mini-btn"
                  id="nextMonth"
                  aria-label="الشهر التالي"
                  title="الشهر التالي"
                >
                  ‹
                </button>
              </div>
            </div>
            <button
              class="button primary"
              id="quickAction"
              type="button"
              title="تسجيل حركة فعلية"
            >
              ＋ حركة جديدة
            </button>
          </div>
        </section>
        <div class="context-line">
          <div>
            <div class="eyebrow" id="pageHeading"></div>
            <h2 id="viewHeading"></h2>
          </div>
          <p id="storageStatus" role="status"></p>
        </div>
        <div id="content" aria-live="polite"></div>
      </main>
      <footer class="site-foot">
        جميع البيانات محفوظة على هذا الجهاز فقط • خذ نسخة احتياطية دورية من قسم
        «البيانات»
      </footer>
    </div>
    <div
      id="dialog"
      hidden
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="dialog-box">
        <h2 id="modalTitle"></h2>
        <form id="editorForm"></form>
      </div>
    </div>
    <script src="accounting-engine.js?v=3.0.6"></script>
    <script src="finance-core.js?v=3.0.6"></script>
    <script src="surplus-manager.js?v=3.0.6"></script>
    <script src="import-v2.js?v=3.0.6"></script>
    <script src="sms-v2.js?v=3.0.6"></script>
    <script src="salary-countdown-v1.js?v=3.0.6"></script>
    <script src="retirement-v1.js?v=3.0.6"></script>
    <script src="unified-forecast-ui.js?v=3.0.6"></script>
    <script src="finance-ui.js?v=3.0.6"></script>
    <script src="actual-v1.js?v=3.0.6"></script>
  </body>
</html>
