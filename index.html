<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>المركز المالي</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#07111f;color:#fff;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{padding:12px 14px 9px;background:linear-gradient(135deg,#10233f,#0b5a53);border-bottom:1px solid #ffffff1a}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:20px;font-weight:900}.sub{font-size:11px;color:#b9d2d0;margin-top:2px}.topActions{display:flex;gap:6px}.topActions button,.restoreLabel{border:1px solid #ffffff24;background:#ffffff10;color:#fff;border-radius:10px;padding:7px 9px;font-weight:800;font-size:11px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:9px;background:#091527;border-bottom:1px solid #ffffff12}.nav button{border:1px solid #ffffff1f;border-radius:13px;background:#13213a;color:#dce8ff;padding:10px 4px;font-weight:900;font-size:11px}.nav button.active{background:#14766d;color:#fff;border-color:#3fc3b4}.stage{position:relative;flex:1;min-height:0}.pane{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:white}.pane.active{display:block}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#10233f"></head><body><div class="app"><div class="top"><div class="row"><div><div class="title">💳 المركز المالي V8</div><div class="sub">الراتب · الميزانية · الحسابات · نسخة حديثة موحدة</div><div id="backupStatus" class="sub" style="font-size:10px;max-width:60vw" role="status"></div></div><div class="topActions"><button id="backupButton" onclick="backupAll()">نسخة شاملة</button><label class="restoreLabel">استعادة<input id="restore" type="file" accept=".json,application/json" hidden></label></div></div></div><div class="nav"><button id="bBudget" class="active" onclick="showPane('budget',this)">📊 الميزانية</button><button id="bAccounts" onclick="showPane('accounts',this)">🏦 الحسابات</button><button id="bSalary" onclick="showPane('salary',this)">💰 الراتب</button><button id="bDebts" onclick="showPane('debts',this)">📅 الديون</button></div><div class="stage"><iframe id="budget" class="pane active" src="budget.html"></iframe><iframe id="accounts" class="pane" src="accounts.html"></iframe><iframe id="salary" class="pane" src="salary.html"></iframe><iframe id="debts" class="pane" src="debt-planner.html?build=20261025-autosync-6"></iframe></div></div><script>
function showPane(id,btn){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const f=document.getElementById(id);if(id==='debts'&&!f.dataset.fresh){f.src='debt-planner.html?build=20261025-autosync-6';f.dataset.fresh='1'}f.classList.add('active');btn.classList.add('active');setTimeout(()=>{try{f.contentWindow.postMessage('finance-refresh','*')}catch(e){}},50)}
function saveText(name,text){try{if(window.Android&&Android.saveText){Android.saveText(name,text);return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const SNAP_TIMEOUT=10000;
const pendingRequests=new Map();
let nextRequest=0;
const KEY_BUDGET='budget_finance_clean_v4';
const KEY_ACCOUNTS='bank_manager_v11_seeded_exact';
const KEY_LINKS='finance_budget_links_v1';
const KEY_ITEMS='finance_budget_item_links_v2';
const statusEl=document.getElementById('backupStatus');
const backupButton=document.getElementById('backupButton');
function backupStatus(t){statusEl.textContent=t}
function unpack(value){if(typeof value==='string')return JSON.parse(value);return value}
function requireBudget(x){const v=unpack(x);if(!v||typeof v!=='object'||!Array.isArray(v.items)||!v.months||typeof v.months!=='object')throw Error('بيانات الميزانية غير مكتملة');return v}
function requireAccounts(x){const v=unpack(x);if(!v||typeof v!=='object'||!Array.isArray(v.accounts)||!Array.isArray(v.history))throw Error('بيانات الحسابات غير مكتملة');return v}
function countSummary(b,a){
 const debts=(a?.finance?.debts||[]).filter(x=>x.name==='دين دراهم');
 const cards=(a?.accounts||[]).filter(x=>x.kind==='credit');
 return {bankAccounts:(a?.accounts||[]).filter(x=>x.kind!=='credit').length,creditCards:cards.length,accountHistory:(a?.history||[]).length,monthlyBudgetRecords:Object.keys(b?.months||{}).length,currentBudgetItems:(b?.items||[]).length,darahimDebtRecords:debts.reduce((sum,d)=>sum+(d.log||[]).length,0)};
}
function messageSection(section,action,value){
 const frame=document.getElementById(section);if(!frame?.contentWindow) return Promise.reject(Error('صفحة '+section+' غير جاهزة'));
 const requestId='fc'+Date.now()+'-'+(++nextRequest);
 return new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>{pendingRequests.delete(requestId);reject(Error('تعذر قراءة '+(section==='budget'?'الميزانية':'الحسابات')+'؛ أعد المحاولة'))},SNAP_TIMEOUT);
   pendingRequests.set(requestId,{resolve,reject,timeout,source:frame.contentWindow,section});
   frame.contentWindow.postMessage({fcBridge:'FinanceCenterV6',action,requestId,value},'*');
 });
}
window.addEventListener('message',(event)=>{
 const d=event.data;if(!d||d.fcBridge!=='FinanceCenterV6'||!d.requestId)return;
 const req=pendingRequests.get(d.requestId);if(!req||req.source!==event.source)return;
 clearTimeout(req.timeout);pendingRequests.delete(d.requestId);
 if(d.ok===false)req.reject(Error(d.error||'فشل تنفيذ العملية'));
 else req.resolve(d.value);
});
async function snapshotAll(){
 const [budget,accounts]=await Promise.all([messageSection('budget','snapshot'),messageSection('accounts','snapshot')]);
 const b=requireBudget(budget.budget),a=requireAccounts(accounts.accounts);
 return {budget,accounts,b,a};
}
async function backupAll(){
 backupButton.disabled=true;backupStatus('جارٍ جمع أحدث البيانات من الميزانية والحسابات…');
 try{
  const {budget,accounts,b,a}=await snapshotAll();
  const summary=countSummary(b,a);
  const now=new Date();
  const payload={format:'FinanceCenterBackupV2',version:2,exportedAt:now.toISOString(),appVersion:'V8-Web',budget:budget.budget,accounts:accounts.accounts,links:budget.links,itemLinks:budget.itemLinks,summary};
  // فحص أن البيانات المسجلة في الملف يمكن قراءتها قبل تنزيله، وليس الاكتفاء باسترجاع المفاتيح.
  requireBudget(payload.budget);requireAccounts(payload.accounts);
  const stamp=now.toISOString().replace(/[-:]/g,'').slice(0,15).replace('T','_');
  saveText('Finance_Center_Full_'+stamp+'.json',JSON.stringify(payload,null,2));
  backupStatus(`نسخة شاملة: ${summary.bankAccounts} حساب بنكي، ${summary.creditCards} فيزا، ${summary.accountHistory} حركة، ${summary.monthlyBudgetRecords} شهر ميزانية. احتفظ بالملف.`);
 }catch(err){backupStatus('فشل النسخ: '+err.message);alert('لم تُنشأ نسخة ناقصة. '+err.message)}
 finally{backupButton.disabled=false}
}
function toRaw(value){return typeof value==='string'?value:JSON.stringify(value)}
function decodeBackup(p){
 if(p?.format==='FinanceCenterBackupV1'||p?.format==='FinanceCenterBackupV2'){
   const budget=requireBudget(p.budget),accounts=requireAccounts(p.accounts);
   return {budget:toRaw(budget),accounts:toRaw(accounts),links:p.links??null,itemLinks:p.itemLinks??null,partial:false};
 }
 if(p?.app==='Budget_Debts_Obligations_Trips_V4_Clean'&&p.data){
   const budget=requireBudget(p.data);
   return {budget:toRaw(budget),accounts:null,links:null,itemLinks:null,partial:true};
 }
 throw Error('صيغة النسخة غير مدعومة أو لا تحتوي على الميزانية والحسابات معًا');
}
async function restoreAll(p){
 const data=decodeBackup(p);
 const txt=data.partial?'هذه نسخة ميزانية فقط؛ ستستعاد الميزانية ولن تتغير الحسابات أو الفيزا الموجودة حاليًا. هل تريد المتابعة؟':'استعادة النسخة الشاملة ستستبدل الحسابات والفيزا والميزانية وسجلات الحركات الموجودة حاليًا. هل تريد المتابعة؟';
 if(!confirm(txt))return;
 backupStatus('جارٍ التحقق من البيانات الحالية قبل الاستعادة…');
 const before=await snapshotAll();
 backupStatus('جارٍ استعادة البيانات…');
 try{
   const jobs=[messageSection('budget','restore',{budget:data.budget,links:data.links,itemLinks:data.itemLinks})];
   if(!data.partial)jobs.push(messageSection('accounts','restore',{accounts:data.accounts}));
   await Promise.all(jobs);
   const after=await snapshotAll();
   if(JSON.stringify(requireBudget(after.budget.budget))!==JSON.stringify(requireBudget(data.budget)))throw Error('تعذر التحقق من الميزانية المستعادة');
   if(!data.partial&&JSON.stringify(requireAccounts(after.accounts.accounts))!==JSON.stringify(requireAccounts(data.accounts)))throw Error('تعذر التحقق من الحسابات المستعادة');
   backupStatus('تمت الاستعادة والتحقق منها. الحسابات والميزانية محدثتان.');
   alert('تمت الاستعادة والتحقق من اكتمال البيانات.');
   for(const x of document.querySelectorAll('iframe'))try{x.contentWindow.postMessage('finance-refresh','*')}catch(_){}
 }catch(err){
   // استرداد الحالة السابقة في حالة فشل التحقق أو جزء من عملية الاستعادة.
   try{await Promise.all([messageSection('budget','restore',before.budget),messageSection('accounts','restore',before.accounts)])}catch(_){}
   throw err;
 }
}
document.getElementById('restore').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{const p=JSON.parse(await file.text());await restoreAll(p)}catch(err){backupStatus('فشلت الاستعادة: '+err.message);alert('لم تكتمل الاستعادة: '+err.message)}
 finally{e.target.value=''}
});
</script></body></html>
