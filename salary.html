<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>عداد الراتب</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#1e293b;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --accent:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{
      width:min(440px,100%);
      background:var(--card);
      border-radius:24px;
      padding:26px 20px;
      text-align:center;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }
    h1{font-size:25px;margin:0 0 8px}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:22px}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .unit{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:16px 10px;
    }
    .num{
      display:block;
      font-size:34px;
      font-weight:700;
      color:var(--accent);
      line-height:1.1;
    }
    .label{display:block;color:var(--muted);margin-top:7px}
    .date{
      margin-top:18px;
      padding:15px;
      border-radius:16px;
      background:rgba(34,197,94,.10);
      color:#dcfce7;
      font-size:16px;
      line-height:1.7;
    }
    .note{margin-top:13px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <main class="app">
    <h1>💰 عداد نزول الراتب</h1>
    <div class="subtitle">يوم 30 من كل شهر — البداية 30 أغسطس 2026</div>

    <section class="grid" aria-live="polite">
      <div class="unit"><span class="num" id="days">--</span><span class="label">يوم</span></div>
      <div class="unit"><span class="num" id="hours">--</span><span class="label">ساعة</span></div>
      <div class="unit"><span class="num" id="minutes">--</span><span class="label">دقيقة</span></div>
      <div class="unit"><span class="num" id="seconds">--</span><span class="label">ثانية</span></div>
    </section>

    <div class="date" id="targetDate">جارٍ حساب الموعد القادم…</div>
    <div class="note">في فبراير يُستخدم آخر يوم من الشهر.</div>
  </main>

<script>
  const FIRST_DATE = new Date(2026, 7, 30, 0, 0, 0, 0);

  function daysInMonth(year, monthIndex){
    return new Date(year, monthIndex + 1, 0).getDate();
  }

  function targetForMonth(year, monthIndex){
    const day = Math.min(30, daysInMonth(year, monthIndex));
    return new Date(year, monthIndex, day, 0, 0, 0, 0);
  }

  function nextSalaryDate(now){
    if (now < FIRST_DATE) return FIRST_DATE;

    let year = now.getFullYear();
    let month = now.getMonth();
    let target = targetForMonth(year, month);

    if (target <= now){
      month += 1;
      if (month > 11){
        month = 0;
        year += 1;
      }
      target = targetForMonth(year, month);
    }
    return target;
  }

  function twoDigits(value){
    return new Intl.NumberFormat('ar-SA', {
      minimumIntegerDigits: 2,
      useGrouping: false
    }).format(value);
  }

  function update(){
    const now = new Date();
    const target = nextSalaryDate(now);
    const diff = Math.max(0, target - now);
    const totalSeconds = Math.floor(diff / 1000);

    document.getElementById('days').textContent =
      new Intl.NumberFormat('ar-SA').format(Math.floor(totalSeconds / 86400));
    document.getElementById('hours').textContent =
      twoDigits(Math.floor((totalSeconds % 86400) / 3600));
    document.getElementById('minutes').textContent =
      twoDigits(Math.floor((totalSeconds % 3600) / 60));
    document.getElementById('seconds').textContent =
      twoDigits(totalSeconds % 60);

    const formatted = new Intl.DateTimeFormat('ar-SA', {
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }).format(target);

    document.getElementById('targetDate').textContent = 'موعد الراتب القادم: ' + formatted;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
